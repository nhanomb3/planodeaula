<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Bloco de Planificação Pedagógica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.8;
        }
        
        .form-section {
            padding: 30px;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
            min-width: 300px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .required::after {
            content: " *";
            color: #e74c3c;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        
        .price-info {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }
        
        .price-info h3 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        
        .price-info p {
            margin: 5px 0;
            font-size: 16px;
        }
        
        .price-value {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .generate-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 600;
        }
        
        .generate-btn:hover {
            background-color: #2980b9;
        }
        
        .pdf-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .pdf-btn:hover {
            background-color: #219653;
        }
        
        .pdf-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .warning {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerador de Bloco de Planificação Pedagógica</h1>
            <p class="subtitle">Plano de Aula MZ - Ministério da Educação</p>
        </header>
        
        <div class="form-section" id="formSection">
            <h2>Dados do Bloco de Planificação</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="escola" class="required">Nome da Escola</label>
                    <input type="text" id="escola" placeholder="Ex: Escola Secundária Samora M. Machel" required>
                </div>
                
                <div class="form-group">
                    <label for="professor" class="required">Nome do Professor</label>
                    <input type="text" id="professor" placeholder="Ex: Benjamim Januário Paulino" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="disciplina">Disciplina</label>
                    <input type="text" id="disciplina" placeholder="Ex: Matemática">
                </div>
                
                <div class="form-group">
                    <label for="classe">Classe</label>
                    <input type="text" id="classe" placeholder="Ex: 10ª Classe">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="anoLectivo">Ano Lectivo</label>
                    <input type="text" id="anoLectivo" placeholder="Ex: 2026">
                </div>
                
                <div class="form-group">
                    <label for="numAulas" class="required">Número de Aulas</label>
                    <select id="numAulas" required>
                        <option value="">Selecione o número de aulas</option>
                        <option value="10">10 aulas (20 páginas)</option>
                        <option value="20">20 aulas (40 páginas)</option>
                        <option value="30">30 aulas (60 páginas)</option>
                        <option value="40">40 aulas (80 páginas)</option>
                        <option value="50">50 aulas (100 páginas)</option>
                        <option value="60">60 aulas (120 páginas)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dataGeracao">Data de Geração</label>
                    <input type="date" id="dataGeracao">
                    <div class="warning">Deixe em branco para usar data automática: _____/_________/20______</div>
                </div>
                
                <div class="form-group">
                    <label for="periodo">Período</label>
                    <select id="periodo">
                        <option value="">Selecione o período</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Noite">Noite</option>
                    </select>
                </div>
            </div>
            
            <div id="priceContainer" class="price-info" style="display: none;">
                <h3>Valor a Pagar</h3>
                <p>Preço: <span class="price-value" id="priceValue">0</span> MZN</p>
                <p><small>(Cada 10 aulas = 20 MZN)</small></p>
            </div>
            
            <div class="btn-group">
                <button class="generate-btn" id="generateBtn">Pré-visualizar Bloco</button>
                <button class="pdf-btn" id="pdfBtn" disabled>Gerar PDF</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos DOM
            const escolaInput = document.getElementById('escola');
            const professorInput = document.getElementById('professor');
            const numAulasSelect = document.getElementById('numAulas');
            const pdfBtn = document.getElementById('pdfBtn');
            const priceContainer = document.getElementById('priceContainer');
            const priceValue = document.getElementById('priceValue');
            
            // Estado dos dados do formulário
            let formData = {
                escola: '',
                professor: '',
                disciplina: '',
                classe: '',
                anoLectivo: '',
                numAulas: '',
                dataGeracao: '',
                periodo: ''
            };
            
            // Atualizar dados do formulário quando os campos mudarem
            function updateFormData() {
                formData = {
                    escola: escolaInput.value,
                    professor: professorInput.value,
                    disciplina: document.getElementById('disciplina').value,
                    classe: document.getElementById('classe').value,
                    anoLectivo: document.getElementById('anoLectivo').value,
                    numAulas: numAulasSelect.value,
                    dataGeracao: document.getElementById('dataGeracao').value,
                    periodo: document.getElementById('periodo').value
                };
                
                // Verificar se pode habilitar o botão Gerar PDF
                validateForm();
            }
            
            // Validar formulário e habilitar/desabilitar botão Gerar PDF
            function validateForm() {
                const isValid = formData.escola && formData.professor && formData.numAulas;
                
                if (isValid) {
                    pdfBtn.disabled = false;
                    pdfBtn.title = "Clique para gerar PDF";
                } else {
                    pdfBtn.disabled = true;
                    pdfBtn.title = "Preencha todos os campos obrigatórios";
                }
            }
            
            // Calcular preço quando o número de aulas mudar
            numAulasSelect.addEventListener('change', function() {
                const numAulas = parseInt(this.value);
                if (numAulas) {
                    const price = (numAulas / 10) * 20;
                    priceValue.textContent = price;
                    priceContainer.style.display = 'block';
                } else {
                    priceContainer.style.display = 'none';
                }
                updateFormData();
            });
            
            // Atualizar dados quando qualquer campo mudar
            const allInputs = document.querySelectorAll('input, select');
            allInputs.forEach(input => {
                input.addEventListener('input', updateFormData);
                input.addEventListener('change', updateFormData);
            });
            
            // Botão Pré-visualizar
            document.getElementById('generateBtn').addEventListener('click', function() {
                // Validar campos obrigatórios
                if (!formData.escola || !formData.professor || !formData.numAulas) {
                    alert('Por favor, preencha os campos obrigatórios (Escola, Professor e Número de Aulas).');
                    return;
                }
                
                // Abrir pré-visualização em nova janela
                openPreview();
            });
            
            // Botão Gerar PDF
            pdfBtn.addEventListener('click', function() {
                if (pdfBtn.disabled) return;
                
                // Abrir página de geração de PDF
                openPdfGenerator();
            });
            
            // Função para abrir pré-visualização
            function openPreview() {
                const previewUrl = `preview.html?escola=${encodeURIComponent(formData.escola)}&professor=${encodeURIComponent(formData.professor)}&disciplina=${encodeURIComponent(formData.disciplina)}&classe=${encodeURIComponent(formData.classe)}&anoLectivo=${encodeURIComponent(formData.anoLectivo)}&numAulas=${formData.numAulas}&dataGeracao=${encodeURIComponent(formData.dataGeracao)}&periodo=${encodeURIComponent(formData.periodo)}`;
                window.open(previewUrl, '_blank');
            }
            
            // Função para abrir gerador de PDF
            function openPdfGenerator() {
                const pdfUrl = `pdf.html?escola=${encodeURIComponent(formData.escola)}&professor=${encodeURIComponent(formData.professor)}&disciplina=${encodeURIComponent(formData.disciplina)}&classe=${encodeURIComponent(formData.classe)}&anoLectivo=${encodeURIComponent(formData.anoLectivo)}&numAulas=${formData.numAulas}&dataGeracao=${encodeURIComponent(formData.dataGeracao)}&periodo=${encodeURIComponent(formData.periodo)}`;
                window.open(pdfUrl, '_blank');
            }
            
            // Inicializar validação
            validateForm();
        });
    </script>
</body>
</html>
