<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar PDF - Bloco de Planificação</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            position: relative;
        }
        
        .blurred {
            filter: blur(5px);
            opacity: 0.5;
            transition: all 0.5s ease;
            pointer-events: none;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px;
            font-family: 'Times New Roman', serif;
        }
        
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        
        .countdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .countdown-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 72px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        .status-text {
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Times New Roman', serif;
        }
        
        .status-subtext {
            font-size: 18px;
            color: #7f8c8d;
            font-family: 'Times New Roman', serif;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            border: none;
            text-decoration: none;
            display: inline-block;
            min-width: 180px;
            font-family: 'Times New Roman', serif;
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .secondary-btn {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
        }
        
        .secondary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(149, 165, 166, 0.4);
        }
        
        .success-btn {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .success-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }
        
        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
            text-align: left;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            font-family: 'Times New Roman', serif;
        }
        
        .info-box h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 20px;
            font-family: 'Times New Roman', serif;
        }
        
        .info-row {
            display: flex;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }
        
        .info-label {
            font-weight: 600;
            width: 150px;
            color: #555;
            font-family: 'Times New Roman', serif;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(52, 152, 219, 0.4);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hidden {
            display: none !important;
        }
        
        .visible {
            display: flex !important;
            animation: fadeIn 0.5s;
        }
        
        .loading {
            font-size: 18px;
            color: #3498db;
            margin: 20px 0;
            font-family: 'Times New Roman', serif;
        }
        
        .success-message {
            margin: 30px 0;
            text-align: center;
        }
        
        .success-message h2 {
            color: #27ae60;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .success-message p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="countdownOverlay" class="countdown-overlay">
        <div class="countdown-circle">
            <span id="circleCountdown">15</span>
        </div>
        <div class="status-text" id="statusText">Carregando dados do PDF</div>
        <div class="status-subtext" id="statusSubtext">Por favor, aguarde...</div>
    </div>
    
    <div class="container" id="mainContainer">
        <h1>Gerando PDF do Bloco de Planificação</h1>
        
        <div id="infoContainer" class="info-box">
            <!-- As informações serão carregadas aqui -->
        </div>
        
        <div id="loadingSection">
            <div class="loading" id="initialLoading">
                Preparando geração do PDF... Por favor, aguarde.
            </div>
            <div class="btn-group">
                <button id="generatePdfBtn" class="btn primary-btn">Iniciar Geração do PDF</button>
                <a href="index.html" class="btn secondary-btn">Voltar ao Formulário</a>
            </div>
        </div>
        
        <div id="successSection" class="hidden">
            <div class="success-message">
                <h2>✅ PDF Gerado com Sucesso!</h2>
                <p>Seu bloco de planificação está pronto para download.</p>
            </div>
            
            <div class="btn-group">
                <button id="downloadPdfBtn" class="btn success-btn">📥 Baixar PDF</button>
                <a href="index.html" class="btn secondary-btn">Criar Novo Bloco</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Obter parâmetros da URL
            const urlParams = new URLSearchParams(window.location.search);
            
            // Extrair dados dos parâmetros
            const dados = {
                escola: urlParams.get('escola') || '',
                professor: urlParams.get('professor') || '',
                disciplina: urlParams.get('disciplina') || '',
                classe: urlParams.get('classe') || '',
                anoLectivo: urlParams.get('anoLectivo') || '',
                numAulas: parseInt(urlParams.get('numAulas')) || 0,
                dataGeracao: urlParams.get('dataGeracao') || '',
                periodo: urlParams.get('periodo') || ''
            };
            
            // Verificar se há dados suficientes
            if (!dados.escola || !dados.professor || !dados.numAulas) {
                document.getElementById('infoContainer').innerHTML = `
                    <h3 style="color: #e74c3c;">⚠️ Dados Insuficientes</h3>
                    <p>Os dados necessários para gerar o PDF não foram fornecidos corretamente.</p>
                    <p>Por favor, volte ao <a href="index.html">formulário</a> e preencha todos os campos obrigatórios.</p>
                `;
                document.getElementById('loadingSection').classList.add('hidden');
                return;
            }
            
            // Elementos DOM
            const countdownOverlay = document.getElementById('countdownOverlay');
            const circleCountdown = document.getElementById('circleCountdown');
            const statusText = document.getElementById('statusText');
            const statusSubtext = document.getElementById('statusSubtext');
            const mainContainer = document.getElementById('mainContainer');
            const loadingSection = document.getElementById('loadingSection');
            const successSection = document.getElementById('successSection');
            const generatePdfBtn = document.getElementById('generatePdfBtn');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const infoContainer = document.getElementById('infoContainer');
            const initialLoading = document.getElementById('initialLoading');
            
            // Exibir informações na tela
            infoContainer.innerHTML = `
                <h3>📋 Dados do Bloco</h3>
                <div class="info-row">
                    <div class="info-label">Escola:</div>
                    <div>${dados.escola || "Não informado"}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Professor:</div>
                    <div>${dados.professor || "Não informado"}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Disciplina:</div>
                    <div>${dados.disciplina || "Não informado"}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Classe:</div>
                    <div>${dados.classe || "Não informado"}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Ano Lectivo:</div>
                    <div>${dados.anoLectivo || "Não informado"}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Número de Aulas:</div>
                    <div>${dados.numAulas} (${dados.numAulas * 2} páginas)</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Período:</div>
                    <div>${dados.periodo || "Não informado"}</div>
                </div>
            `;
            
            // Formatar data
            let dataFormatada = "_____/_________/20______";
            if (dados.dataGeracao) {
                const dataObj = new Date(dados.dataGeracao);
                dataFormatada = dataObj.toLocaleDateString('pt-MZ', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            }
            
            // Variáveis para controle do processo
            let progress = 0;
            let countdown = 15;
            let pdfDoc = null;
            let pdfGenerated = false;
            
            // Atualizar a contagem no círculo
            function updateCountdown() {
                circleCountdown.textContent = countdown;
            }
            
            // Mostrar mensagem de status
            function showStatus(message, submessage = "Por favor, aguarde...") {
                statusText.textContent = message;
                statusSubtext.textContent = submessage;
            }
            
            // Iniciar o processo de geração
            generatePdfBtn.addEventListener('click', function() {
                startGenerationProcess();
            });
            
            // Função para iniciar o processo de geração
            function startGenerationProcess() {
                // Desfocar o conteúdo principal
                mainContainer.classList.add('blurred');
                
                // Mostrar overlay de contagem
                countdownOverlay.classList.add('active');
                
                // Desabilitar botão de iniciar
                generatePdfBtn.disabled = true;
                generatePdfBtn.textContent = "Gerando...";
                
                // Atualizar contagem inicial
                updateCountdown();
                showStatus("Carregando dados do PDF");
                
                // Iniciar contador
                const countdownInterval = setInterval(function() {
                    countdown--;
                    updateCountdown();
                    
                    // Atualizar mensagens conforme o progresso
                    if (countdown === 10) {
                        showStatus("Processando dados");
                    } else if (countdown === 7) {
                        showStatus("Montando o PDF");
                    } else if (countdown === 3) {
                        showStatus("Finalizando PDF");
                    }
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        showStatus("PDF concluído!", "Aguarde um momento...");
                        
                        setTimeout(() => {
                            completeGeneration();
                        }, 1000);
                    }
                }, 1000);
            }
            
            // Função para completar a geração
            function completeGeneration() {
                // Gerar o PDF
                generatePDF(dados, dataFormatada);
                
                // Esconder overlay
                countdownOverlay.classList.remove('active');
                
                // Remover blur do conteúdo principal
                mainContainer.classList.remove('blurred');
                
                // Mostrar seção de sucesso
                setTimeout(function() {
                    loadingSection.classList.add('hidden');
                    successSection.classList.remove('hidden');
                }, 500);
            }
            
            // Botão para baixar PDF
            downloadPdfBtn.addEventListener('click', function() {
                if (pdfDoc && pdfGenerated) {
                    const fileName = `Bloco_Planificacao_${dados.professor.replace(/\s+/g, '_')}_${dados.numAulas}_Aulas.pdf`;
                    pdfDoc.save(fileName);
                } else {
                    alert("PDF ainda não foi gerado. Por favor, aguarde.");
                }
            });
            
            // Função para carregar imagem
            function loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const dataUrl = canvas.toDataURL('image/png');
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = url;
                });
            }
            
            // Função para gerar o PDF
            async function generatePDF(dados, dataFormatada) {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({
                        orientation: 'landscape',
                        unit: 'mm',
                        format: 'a4'
                    });
                    
                    // Configurações iniciais
                    doc.setProperties({
                        title: `Bloco de Planificação - ${dados.professor}`,
                        subject: 'Plano de Aula',
                        author: 'Plano de Aula MZ',
                        creator: 'Sistema de Geração de Blocos'
                    });
                    
                    // ===== PÁGINA 1 =====
                    // Adicionar borda dupla (APENAS PÁGINA 1)
                    doc.setLineWidth(1.5);
                    doc.rect(10, 10, 277, 187); // Borda externa
                    doc.setLineWidth(0.8);
                    doc.rect(12, 12, 273, 183); // Borda interna
                    
                    // Carregar e adicionar imagem
                    try {
                        const imgUrl = 'https://raw.githubusercontent.com/nhanomb3/planodeaula/6143d599ba10a0f35fdf07a14baca1b76518bed3/1770417519977.png';
                        const imgData = await loadImage(imgUrl);
                        doc.addImage(imgData, 'PNG', 148-15, 15, 30, 30); // Centralizada, tamanho menor
                    } catch (error) {
                        console.log('Imagem não carregada, continuando sem ela');
                    }
                    
                    // Título centralizado
                    doc.setFontSize(18);
                    doc.setFont("times", "bold");
                    doc.text("REPÚBLICA DE MOÇAMBIQUE", 148, 50, { align: "center" });
                    doc.text("MINISTÉRIO DA EDUCAÇÃO", 148, 60, { align: "center" });
                    doc.text("BLOCO DE PLANIFICAÇÃO", 148, 70, { align: "center" });
                    
                    // Linha com símbolo
                    doc.setLineWidth(0.5);
                    doc.line(60, 75, 235, 75);
                    doc.setFontSize(14);
                    doc.text("⬛", 148, 75, { align: "center" });
                    
                    // Informações centralizadas
                    doc.setFontSize(12);
                    doc.setFont("times", "normal");
                    doc.text(`ESCOLA: ${dados.escola || "___________________"}`, 148, 90, { align: "center" });
                    doc.text(`PROFESSOR: ${dados.professor || "___________________"}`, 148, 100, { align: "center" });
                    doc.text(`DISCIPLINA: ${dados.disciplina || "___________________"}`, 148, 110, { align: "center" });
                    doc.text(`CLASSE: ${dados.classe || "___________________"}`, 148, 120, { align: "center" });
                    doc.text(`BLOCO COM ${dados.numAulas} AULAS: ${dados.numAulas * 2} páginas`, 148, 130, { align: "center" });
                    
                    // Data de geração no rodapé
                    doc.setFontSize(10);
                    doc.text(`Data de geração: ${dataFormatada}`, 148, 180, { align: "center" });
                    
                    // ===== PÁGINA 2 - DECLARAÇÃO PEDAGÓGICA =====
                    doc.addPage();
                    
                    // Adicionar borda dupla (APENAS PÁGINA 2)
                    doc.setLineWidth(1.5);
                    doc.rect(10, 10, 277, 187);
                    doc.setLineWidth(0.8);
                    doc.rect(12, 12, 273, 183);
                    
                    doc.setFontSize(16);
                    doc.setFont("times", "bold");
                    doc.text("DECLARAÇÃO PEDAGÓGICA", 148, 30, { align: "center" });
                    
                    doc.setFontSize(12);
                    doc.setFont("times", "normal");
                    
                    let yPos = 50;
                    const textoDeclaracao = [
                        "O presente documento constitui um instrumento oficial de planificação didática, elaborado em conformidade com as diretrizes curriculares nacionais e os princípios pedagógicos estabelecidos pelo Ministério da Educação de Moçambique.",
                        "",
                        `Este bloco de planificação é de uso exclusivo e pessoal do Professor ${dados.professor || "___________________"}, destinando-se unicamente ao exercício profissional da atividade docente, com vista à organização, execução e avaliação do processo de ensino-aprendizagem.`,
                        "",
                        "O conteúdo aqui plasmado reflete o planeamento pedagógico do Professor, baseado no programa curricular vigente, e deve ser utilizado com ética, responsabilidade e compromisso com a qualidade educativa.",
                        "",
                        "Fica expressamente proibida a reprodução, distribuição, partilha ou utilização por terceiros não autorizados, resguardando-se os direitos de propriedade intelectual e as normas deontológicas da profissão.",
                        "",
                        `A presente declaração atesta a autenticidade e finalidade educativa deste documento, que poderá ser solicitado para fins de supervisão pedagógica e avaliação do desempenho do Professor ${dados.professor || "___________________"}, nos termos legais aplicáveis.`
                    ];
                    
                    textoDeclaracao.forEach(linha => {
                        if (yPos > 170) {
                            doc.addPage();
                            yPos = 30;
                        }
                        
                        if (linha === "") {
                            yPos += 5;
                        } else {
                            const lines = doc.splitTextToSize(linha, 250);
                            doc.text(lines, 20, yPos);
                            yPos += lines.length * 7;
                        }
                    });
                    
                    yPos += 15;
                    doc.text("ASSINATURA DO DOCENTE:", 20, yPos);
                    yPos += 10;
                    doc.text("_________________________________________", 20, yPos);
                    yPos += 10;
                    doc.text(dados.professor || "___________________", 20, yPos);
                    
                    // Data no rodapé
                    doc.setFontSize(10);
                    doc.text(`Data: ${dataFormatada}`, 148, 190, { align: "center" });
                    
                    // ===== PÁGINAS DE PLANO DE AULA =====
                    for (let i = 1; i <= dados.numAulas; i++) {
                        // Página ímpar - Parte 1 do plano de aula
                        doc.addPage();
                        
                        // NÃO ADICIONAR BORDA - Removido código de borda
                        
                        // Cabeçalho do plano de aula
                        doc.setFontSize(16);
                        doc.setFont("times", "bold");
                        doc.text("PLANO DE AULA", 148, 25, { align: "center" });
                        
                        // Informações organizadas
                        doc.setFontSize(12);
                        doc.setFont("times", "normal");
                        
                        // Lado esquerdo
                        let leftY = 45;
                        doc.text(`Escola: ${dados.escola || "___________________"}`, 20, leftY);
                        leftY += 8;
                        doc.text(`Data: __________/__________/__________`, 20, leftY);
                        leftY += 8;
                        doc.text(`Nome do Professor: ${dados.professor || "___________________"}`, 20, leftY);
                        leftY += 8;
                        doc.text(`Disciplina: ${dados.disciplina || "___________________"}`, 20, leftY);
                        leftY += 8;
                        doc.text(`Unidade temática: ___________________`, 20, leftY);
                        leftY += 8;
                        doc.text(`Tema: ___________________`, 20, leftY);
                        leftY += 10;
                        
                        doc.setFont("times", "bold");
                        doc.text(`Objectivos:`, 20, leftY);
                        doc.setFont("times", "normal");
                        leftY += 8;
                        doc.text(`Geral: ___________________________________________`, 30, leftY);
                        leftY += 8;
                        doc.text(`Específicos:`, 30, leftY);
                        leftY += 8;
                        doc.text(`Cognitivo: _____________________________________`, 40, leftY);
                        leftY += 8;
                        doc.text(`Psicomotor: ____________________________________`, 40, leftY);
                        leftY += 8;
                        doc.text(`Afetivo: _______________________________________`, 40, leftY);
                        
                        // Lado direito
                        let rightY = 45;
                        doc.text(`Classe: ${dados.classe || "__________"}`, 160, rightY);
                        rightY += 8;
                        doc.text(`Turma: __________`, 160, rightY);
                        rightY += 8;
                        doc.text(`Período: ${dados.periodo || "__________"}`, 160, rightY);
                        rightY += 8;
                        doc.text(`Lição nº: ${i}`, 160, rightY);
                        rightY += 8;
                        doc.text(`Tipo de aula: __________`, 160, rightY);
                        rightY += 8;
                        doc.text(`Número de alunos: __________`, 160, rightY);
                        
                        // Tabela para Introdução e Motivação / Mediação e Assimilação
                        leftY += 15;
                        doc.autoTable({
                            startY: leftY,
                            head: [[
                                {content: 'TEMPO', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'FUNÇÕES DIDÁCTICAS', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'CONTEÚDOS', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'ACTIVIDADES DO PROFESSOR', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'ACTIVIDADES DOS ALUNOS', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'MÉTODOS DE ENSINO', styles: {fontSize: 10, fontStyle: 'bold'}},
                                {content: 'MEIOS DE ENSINO', styles: {fontSize: 10, fontStyle: 'bold'}}
                            ]],
                            body: [
                                [
                                    {content: 'Introdução\n e Motivação', rowSpan: 2, styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}}
                                ],
                                [
                                    {content: 'Mediação e Assimilação', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}},
                                    {content: '___________________', styles: {fontSize: 10}}
                                ]
                            ],
                            theme: 'grid',
                            headStyles: {fillColor: [220, 220, 220], fontSize: 10, fontStyle: 'bold', font: 'times'},
