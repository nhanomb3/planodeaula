<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; padding: 25px; text-align: center; }
        .card-body { padding: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-control { width: 100%; padding: 12px 15px; border: 2px solid #e1e5ee; border-radius: 8px; font-size: 16px; transition: all 0.3s; }
        .form-control:focus { border-color: #6a11cb; outline: none; box-shadow: 0 0 0 3px rgba(106,17,203,0.1); }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; margin-bottom: 15px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(106,17,203,0.3); }
        .btn-secondary { background: #f8f9fa; color: #555; border: 2px solid #e1e5ee; margin-bottom: 10px; }
        .form-toggle { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .form-toggle a { color: #6a11cb; text-decoration: none; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .debug-info { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 5px; padding: 10px; margin-top: 10px; font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Bem-vindo</h1>
                <p>Faça login ou crie uma conta</p>
            </div>
            <div class="card-body">
                <div id="message" class="message hidden"></div>
                
                <button onclick="testarConexaoGAS()" class="btn btn-secondary">Testar Conexão GAS</button>
                <button onclick="listarUsuarios()" class="btn btn-secondary">Listar Usuários</button>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email ou Celular</label>
                        <input type="text" id="loginEmail" class="form-control" required value="848960732">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" class="form-control" required value="123456">
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
                
                <form id="registerForm" class="hidden">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="registerName" class="form-control" required value="Benjamim">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" class="form-control" required value="edmilsonnhanombe62@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>Celular</label>
                        <input type="tel" id="registerPhone" class="form-control" required value="849976321">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="registerPassword" class="form-control" required value="123456">
                    </div>
                    <button type="submit" class="btn btn-primary">Criar Conta</button>
                </form>
                
                <div class="form-toggle">
                    <span id="toggleText">Não tem uma conta?</span>
                    <a id="toggleLink">Criar Conta</a>
                </div>

                <div id="debugInfo" class="debug-info hidden">
                    <strong>Debug Info:</strong>
                    <div id="debugContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOiyHhMULkS9jye2_r9f1FjWYTgiQH4z1qIHQxpRID3pGQe-cdz3CwfS_QP2mRaI6oQw/exec';
        
        // Elementos DOM
        const elements = {
            message: document.getElementById('message'),
            loginForm: document.getElementById('loginForm'),
            registerForm: document.getElementById('registerForm'),
            toggleLink: document.getElementById('toggleLink'),
            toggleText: document.getElementById('toggleText'),
            debugInfo: document.getElementById('debugInfo'),
            debugContent: document.getElementById('debugContent')
        };

        let isLoginMode = true;

        // Funções de utilidade
        function showMessage(text, type) {
            elements.message.textContent = text;
            elements.message.className = `message ${type}`;
            elements.message.classList.remove('hidden');
        }

        function showDebugInfo(info) {
            elements.debugContent.textContent = JSON.stringify(info, null, 2);
            elements.debugInfo.classList.remove('hidden');
        }

        // Funções de teste
        async function testarConexaoGAS() {
            showMessage('Testando conexão...', 'success');
            try {
                const response = await fetch(SCRIPT_URL + '?action=test', { method: 'POST' });
                const result = await response.json();
                showDebugInfo({ url: SCRIPT_URL, status: response.status, result });
                showMessage(result.success ? '✅ Conexão OK!' : '❌ Erro no GAS', result.success ? 'success' : 'error');
            } catch (error) {
                showDebugInfo({ url: SCRIPT_URL, error: error.toString() });
                showMessage('❌ Falha na conexão', 'error');
            }
        }

        async function listarUsuarios() {
            showMessage('Buscando usuários...', 'success');
            try {
                const response = await fetch(SCRIPT_URL + '?action=listUsers', { method: 'POST' });
                const result = await response.json();
                showDebugInfo(result);
                showMessage(result.success ? `✅ ${result.total} usuários encontrados` : '❌ Erro ao listar', result.success ? 'success' : 'error');
            } catch (error) {
                showDebugInfo({ error: error.toString() });
                showMessage('❌ Erro ao listar usuários', 'error');
            }
        }

        // Função principal de requisição
        async function fazerRequisicao(action, dados) {
            const urlParams = new URLSearchParams({ action, ...dados });
            console.log(`Enviando ${action}:`, Object.fromEntries(urlParams));
            
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: urlParams
            });
            
            return await response.json();
        }

        // Event Listeners
        elements.toggleLink.addEventListener('click', function() {
            isLoginMode = !isLoginMode;
            elements.loginForm.classList.toggle('hidden', !isLoginMode);
            elements.registerForm.classList.toggle('hidden', isLoginMode);
            elements.toggleText.textContent = isLoginMode ? 'Não tem uma conta?' : 'Já tem uma conta?';
            elements.toggleLink.textContent = isLoginMode ? 'Criar Conta' : 'Fazer Login';
        });

        elements.loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }

            try {
                const result = await fazerRequisicao('login', { email, senha: password });
                showMessage(result.message, result.success ? 'success' : 'error');
                showDebugInfo(result);
            } catch (error) {
                showMessage('Erro de conexão: ' + error, 'error');
            }
        });

        elements.registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                nome: document.getElementById('registerName').value,
                email: document.getElementById('registerEmail').value,
                cellular: document.getElementById('registerPhone').value,
                senha: document.getElementById('registerPassword').value
            };

            if (Object.values(data).some(val => !val)) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }

            try {
                const result = await fazerRequisicao('register', data);
                showMessage(result.message, result.success ? 'success' : 'error');
                showDebugInfo(result);
                
                if (result.success) {
                    setTimeout(() => elements.toggleLink.click(), 2000);
                }
            } catch (error) {
                showMessage('Erro de conexão: ' + error, 'error');
            }
        });

        // Teste automático ao carregar
        window.addEventListener('load', () => setTimeout(testarConexaoGAS, 500));
    </script>
</body>
</html>
