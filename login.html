<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .card-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .card-header p {
            opacity: 0.9;
        }

        .card-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5ee;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #6a11cb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(106, 17, 203, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #555;
            border: 2px solid #e1e5ee;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .form-toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .form-toggle a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Bem-vindo</h1>
                <p>Faça login ou crie uma conta</p>
            </div>
            <div class="card-body">
                <!-- Mensagens -->
                <div id="message" class="message hidden"></div>
                
                <!-- Formulário de Login -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email ou Número de Celular</label>
                        <input type="text" id="loginEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Senha</label>
                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span>Entrar</span>
                    </button>
                </form>
                
                <!-- Formulário de Criação de Conta -->
                <form id="registerForm" class="hidden">
                    <div class="form-group">
                        <label for="registerName">Nome Completo</label>
                        <input type="text" id="registerName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPhone">Número de Celular</label>
                        <input type="tel" id="registerPhone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Senha</label>
                        <input type="password" id="registerPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        <span>Criar Conta</span>
                    </button>
                </form>
                
                <!-- Alternar entre formulários -->
                <div class="form-toggle">
                    <span id="toggleText">Não tem uma conta?</span>
                    <a id="toggleLink">Criar Conta</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwy_PIcbyuOBv7yDg7wPJd2jC9GEQxp1lfqSpltzfIoJwXD-_9ehs3_xBvTI5dh-r7o_g/exec';
        
        // Elementos DOM
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        
        // Estado atual
        let isLoginMode = true;
        
        // Alternar entre login e registro
        toggleLink.addEventListener('click', function() {
            if (isLoginMode) {
                // Mudar para modo de registro
                loginForm.classList.add('fade-out');
                setTimeout(() => {
                    loginForm.classList.add('hidden');
                    loginForm.classList.remove('fade-out');
                    registerForm.classList.remove('hidden');
                    registerForm.classList.add('fade-in');
                    toggleText.textContent = 'Já tem uma conta?';
                    toggleLink.textContent = 'Fazer Login';
                    isLoginMode = false;
                }, 300);
            } else {
                // Mudar para modo de login
                registerForm.classList.add('fade-out');
                setTimeout(() => {
                    registerForm.classList.add('hidden');
                    registerForm.classList.remove('fade-out');
                    loginForm.classList.remove('hidden');
                    loginForm.classList.add('fade-in');
                    toggleText.textContent = 'Não tem uma conta?';
                    toggleLink.textContent = 'Criar Conta';
                    isLoginMode = true;
                }, 300);
            }
        });
        
        // Mostrar mensagem
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            // Auto-esconder após 5 segundos
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 5000);
        }
        
        // Mostrar loading no botão
        function setButtonLoading(button, isLoading) {
            const span = button.querySelector('span');
            if (isLoading) {
                button.disabled = true;
                span.textContent = '';
                const loading = document.createElement('div');
                loading.className = 'loading';
                span.appendChild(loading);
                
                if (button.id === 'loginBtn') {
                    span.appendChild(document.createTextNode(' Entrando...'));
                } else {
                    span.appendChild(document.createTextNode(' Criando conta...'));
                }
            } else {
                button.disabled = false;
                if (button.id === 'loginBtn') {
                    span.textContent = 'Entrar';
                } else {
                    span.textContent = 'Criar Conta';
                }
            }
        }
        
        // Login
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Por favor, preencha todos os campos.', 'error');
                return;
            }
            
            setButtonLoading(loginBtn, true);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: 'login',
                        email: email,
                        senha: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Login realizado com sucesso!', 'success');
                    // Redirecionar após sucesso
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage('Falha no login: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('Erro de conexão. Tente novamente.', 'error');
            } finally {
                setButtonLoading(loginBtn, false);
            }
        });
        
        // Registro
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;
            
            if (!name || !email || !phone || !password) {
                showMessage('Por favor, preencha todos os campos.', 'error');
                return;
            }
            
            setButtonLoading(registerBtn, true);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: 'register',
                        nome: name,
                        email: email,
                        cellular: phone,
                        senha: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('Conta criada com sucesso!', 'success');
                    // Voltar para o login após sucesso
                    setTimeout(() => {
                        toggleLink.click();
                        registerForm.reset();
                    }, 2000);
                } else {
                    showMessage('Erro ao criar conta: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                showMessage('Erro de conexão. Tente novamente.', 'error');
            } finally {
                setButtonLoading(registerBtn, false);
            }
        });
    </script>
</body>
</html>
